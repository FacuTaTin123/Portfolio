<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if perfil %}{{ perfil.nombre }}{% else %}Portfolio{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand bg-white shadow-sm px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <span class="brand-mark"><i class="fa-solid fa-code"></i></span>
        <span>{% if perfil %}{{ perfil.nombre }}{% endif %}</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <a class="social-link" href="{{ perfil.github if perfil and perfil.github else 'https://github.com/FacuTaTin123' }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github fa-lg"></i><span>GitHub</span></a>
        <a class="social-link" href="{{ perfil.linkedin if perfil and perfil.linkedin else 'https://www.linkedin.com/in/facundo-balancini-27047b41b/' }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin fa-lg"></i><span>LinkedIn</span></a>
        <a href="{{ url_for('cv') }}" class="btn btn-cv btn-sm"><i class="fa fa-download"></i> CV</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('logout') }}" class="btn btn-success btn-sm">Logout</a>
        {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-success btn-sm">Login</a>
        {% endif %}
    </div>
</nav>

{% with mensajes = get_flashed_messages() %}
{% for m in mensajes %}<div class="alert alert-danger m-3">{{ m }}</div>{% endfor %}
{% endwith %}

{% block contenido %}{% endblock %}
</body>
</html>
